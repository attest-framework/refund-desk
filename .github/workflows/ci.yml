# Demo channels (attest v1.0.0 plan, contract C6):
#   edge      this commit against attest `main`, built by setup-attest
#   released  the latest verified-<version> tag against its published packages
# No job calls a paid model: the scripted model server answers the agent and the
# attest judge, and no secret is read.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["verified-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: edge (attest main)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build attest main
        id: attest
        uses: attest-framework/attest/.github/actions/setup-attest@0b2283542b288b6e1ef54af0c37b5e77339921f6 # v1.0.0-rc.1
        with:
          ref: main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json

      - name: Install the agents on attest main
        env:
          ATTEST_SRC: ${{ steps.attest.outputs.source-dir }}
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
          ATTEST_CORE_TGZ: ${{ steps.attest.outputs.core-tarball }}
          ATTEST_VITEST_TGZ: ${{ steps.attest.outputs.vitest-tarball }}
        run: make setup CHANNEL=edge

      - name: make check
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make check CHANNEL=edge

      # pr-annotate resolves each row's `file` (relative to the test rootdir) by prefixing the
      # report's own directory, so the reports go next to the tests that wrote them. This runs
      # right after `make check`: `make replay-miss` below rewrites the replay reports with its
      # deliberate miss, which must not be what the pull request sees.
      - name: Place reports beside their tests
        if: always()
        run: |
          set -eu
          for lang in py ts; do
            for f in reports/attest-report."$lang".json reports/attest-report.replay."$lang".json; do
              if [ -f "$f" ]; then cp "$f" "$lang/"; fi
            done
          done

      # Checks the frozen INC-1042 traces committed under incidents/.
      - name: make doctor
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make doctor CHANNEL=edge

      - name: make flaky
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make flaky CHANNEL=edge

      - name: make capture-check
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make capture-check CHANNEL=edge

      # Acceptance proof for replay: a changed system prompt makes strict replay fail with the
      # miss message in both languages. The script restores the prompt.
      - name: make replay-miss
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make replay-miss CHANNEL=edge

      - name: Reproduce INC-1042
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make incident CHANNEL=edge

      # The annotate job holds the only write token and runs no PR code; it reads these copies.
      - name: Upload reports for the annotate job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annotate-reports
          path: |
            py/attest-report*.json
            ts/attest-report*.json
          if-no-files-found: warn

      - name: Upload reports and incident traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-reports
          path: |
            reports/
            .stack/incident-traces/
          if-no-files-found: warn

  # The only job with pull-requests: write. It runs no PR code (no make, install or tests): it
  # downloads the reports edge staged under py/ and ts/ (pr-annotate prefixes each row's file
  # with the report's directory), builds the engine from attest main itself, and posts the
  # summary comment and annotations. edge stays the gating job and keeps its own result.
  annotate:
    name: annotate (summary and annotations)
    needs: edge
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build attest main
        id: attest
        uses: attest-framework/attest/.github/actions/setup-attest@0b2283542b288b6e1ef54af0c37b5e77339921f6 # v1.0.0-rc.1
        with:
          ref: main

      - name: Download the staged reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: annotate-reports
          path: .

      - name: Gate the reports and annotate
        uses: attest-framework/attest/.github/actions/pr-annotate@f81ccdc15f7903c51dfee4110d3950eb6b6bd579 # attest main (#157)
        with:
          report: |
            py/attest-report.py.json
            py/attest-report.replay.py.json
            ts/attest-report.ts.json
            ts/attest-report.replay.ts.json
          policy: attest.policy.yaml
          engine-binary: ${{ steps.attest.outputs.engine-path }}

  released:
    name: released (latest verified tag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find the latest verified tag
        id: tag
        run: |
          set -euo pipefail
          # versionsort.suffix sorts 1.0.0-rc.N below 1.0.0.
          tag="$(git -c versionsort.suffix=-rc tag --list 'verified-*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::notice::No verified-* tag exists yet; the released channel has nothing to check."
          elif ! git merge-base --is-ancestor "refs/tags/$tag" refs/remotes/origin/main; then
            echo "::error::$tag is not on main; verified tags mark main commits only."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the verified tag
        if: steps.tag.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Check the tag pins its published attest version
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#verified-}"
          pep440="$(echo "$version" | sed -E 's/-rc\.([0-9]+)$/rc\1/')"
          py="$(grep -A1 '^name = "attest-ai"$' py/uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          core="$(jq -r '.devDependencies["@attest-ai/core"]' ts/package.json)"
          vitest="$(jq -r '.devDependencies["@attest-ai/vitest"]' ts/package.json)"
          echo "tag $TAG: attest-ai $py, @attest-ai/core $core, @attest-ai/vitest $vitest"
          if [ "$py" != "$pep440" ] || [ "$core" != "$version" ] || [ "$vitest" != "$version" ]; then
            echo "::error::$TAG must pin attest-ai==$pep440 and @attest-ai/*@$version"
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.tag.outputs.tag != ''

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.tag.outputs.tag != ''
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tag.outputs.tag != ''
        with:
          node-version: 22

      - name: Install the agents on the published attest
        if: steps.tag.outputs.tag != ''
        run: make setup CHANNEL=released

      - name: make check
        if: steps.tag.outputs.tag != ''
        run: make check CHANNEL=released

      - name: Upload reports
        if: always() && steps.tag.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: released-reports
          path: reports/
          if-no-files-found: warn
