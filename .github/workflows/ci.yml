# Demo channels (contract C6; attest 1.1.0-rc.3 released, attest main edge):
#   edge      this commit against attest `main`, built by setup-attest
#   released  the latest verified-<version> tag against its published packages
# No job calls a paid model: the scripted model server answers the agent and the
# attest judge, and no secret is read.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["verified-*"]
  # The nightly run: the walkthrough on the released channel (latest verified-* tag) and the edge
  # job, which refreshes main's baseline artifact. Scheduled workflows run on the default branch
  # only.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  edge:
    name: edge (attest main)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read lets the baseline step list main's runs and download one's artifact. PR code
    # runs later in this same job, so the token's scope (contents: read, actions: read) is the
    # real limit on what that code can reach; the job holds no write permission.
    permissions:
      contents: read
      actions: read
    outputs:
      baseline-run-id: ${{ steps.baseline.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build attest main
        id: attest
        uses: attest-framework/attest/.github/actions/setup-attest@52cc9b494c2ad8390aef17d40ff60484540b6603 # v1.1.0-rc.3
        with:
          ref: main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json

      # A pull request is gated against the reports of the latest successful push, workflow_dispatch or
      # schedule run on main (the nightly runs edge too, so the artifact is refreshed daily and
      # cannot expire on a quiet main)
      # (artifact attest-reports, uploaded below): an assertion that passed there and does not
      # pass now blocks (block_on_regression), and so does a baselined assertion that vanished.
      # Bootstrap: when main has no successful run of those events yet, there is nothing to compare with;
      # that is logged as a warning and the run goes on without the baseline. Every other case
      # (a run without a usable artifact, an API or download error) fails the job.
      - name: Find the baseline reports of main
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: &select-baseline |
          set -euo pipefail
          # One query per trusted event, so the API filters by event: pull_request runs (including
          # fork PRs from a branch named main) can never fill the window and hide main's runs.
          runs="$(for ev in push workflow_dispatch schedule; do
              gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
                --status success --event "$ev" --limit 20 --json databaseId,headSha,createdAt || exit 1
            done | jq -sc 'add | sort_by(.createdAt) | reverse | .[:20]')"
          if [ "$(echo "$runs" | jq length)" -eq 0 ]; then
            echo "::warning::Baseline bootstrap: no successful push, workflow_dispatch or schedule run of ci.yml on main yet, so this run has no baseline and block_on_regression is not enforced. The first green push to main creates it."
            exit 0
          fi
          while read -r run_id head_sha; do
            found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '[.artifacts[] | select(.name == "attest-reports" and (.expired | not))] | length')"
            if [ "$found" -gt 0 ]; then
              echo "::notice::Baseline: run $run_id on main ($head_sha)"
              echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(echo "$runs" | jq -r '.[] | "\(.databaseId) \(.headSha)"')
          echo "::error::The last $(echo "$runs" | jq length) successful push, workflow_dispatch or schedule runs on main have no unexpired attest-reports artifact. Recovery: run ci.yml on main (Actions, ci, Run workflow, branch main, or: gh workflow run ci.yml --ref main), wait for it to pass, then re-run this job."
          exit 1

      - name: Download the baseline reports
        if: steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attest-reports
          path: baseline-reports
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Install the agents on attest main
        env:
          ATTEST_SRC: ${{ steps.attest.outputs.source-dir }}
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
          ATTEST_CORE_TGZ: ${{ steps.attest.outputs.core-tarball }}
          ATTEST_VITEST_TGZ: ${{ steps.attest.outputs.vitest-tarball }}
        run: make setup CHANNEL=edge

      # make check writes the failure viewer (reports/attest-report.html) before the outage act, with the baseline
      # diff when BASELINE_DIR holds main's reports; it also pins those reports and evaluates the
      # merge policy with --baseline. PYTEST_XDIST runs the Python suites in parallel; Vitest keeps
      # its config (fileParallelism: false, the tests share one process-wide payments URL).
      - name: make check
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
          BASELINE_DIR: ${{ steps.baseline.outputs.run-id != '' && 'baseline-reports' || '' }}
          PYTEST_XDIST: -n auto
        run: make check CHANNEL=edge

      # Uploaded right after make check for the same reason as the copy step below: replay-miss
      # rewrites the replay reports. The reports hold traces (synthetic data in this demo), and a
      # run on main makes them the next baseline.
      - name: Upload the failure viewer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attest-report-html
          path: reports/attest-report.html
          if-no-files-found: warn

      - name: Upload the reports with traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attest-reports
          path: |
            reports/attest-report.py.json
            reports/attest-report.ts.json
            reports/attest-report.replay.py.json
            reports/attest-report.replay.ts.json
          if-no-files-found: warn
          retention-days: 30

      # pr-annotate resolves each row's `file` (relative to the test rootdir) by prefixing the
      # report's own directory, so the reports go next to the tests that wrote them. This runs
      # right after `make check`: `make replay-miss` below rewrites the replay reports with its
      # deliberate miss, which must not be what the pull request sees.
      - name: Place reports beside their tests
        if: always()
        run: |
          set -eu
          for lang in py ts; do
            for f in reports/attest-report."$lang".json reports/attest-report.replay."$lang".json; do
              if [ -f "$f" ]; then cp "$f" "$lang/"; fi
            done
          done

      # Checks the frozen INC-1042 traces committed under incidents/.
      - name: make doctor
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make doctor CHANNEL=edge

      - name: make flaky
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make flaky CHANNEL=edge

      - name: make capture-check
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make capture-check CHANNEL=edge

      # Acceptance proof for replay: a changed system prompt makes strict replay fail with the
      # miss message in both languages. The script restores the prompt.
      - name: make replay-miss
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make replay-miss CHANNEL=edge

      - name: Reproduce INC-1042
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
        run: make incident CHANNEL=edge

      # The annotate job holds the only write token and runs no PR code; it reads these copies.
      - name: Upload reports for the annotate job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annotate-reports
          path: |
            py/attest-report*.json
            ts/attest-report*.json
          if-no-files-found: warn

      - name: Upload reports and incident traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-reports
          path: |
            reports/
            .stack/incident-traces/
          if-no-files-found: warn

  # The only job with pull-requests: write. It runs no PR code (no make, install or tests): it
  # downloads the reports edge staged under py/ and ts/ (pr-annotate prefixes each row's file
  # with the report's directory), builds the engine from attest main itself, and posts the
  # summary comment and annotations. Both edge and annotate gate the required job.
  annotate:
    name: annotate (summary and annotations)
    needs: edge
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Allocate private Go cache directories
        id: go-cache
        run: echo "root=$(mktemp -d "$RUNNER_TEMP/annotate-go-XXXXXXXX")" >> "$GITHUB_OUTPUT"

      - name: Build attest main
        id: attest
        uses: attest-framework/attest/.github/actions/setup-attest@52cc9b494c2ad8390aef17d40ff60484540b6603 # v1.1.0-rc.3
        # setup-attest has no cache switch. Scope Go's module/build caches to a private
        # random directory created after edge finishes, separate from its cache paths.
        # The action may still contact the cache service; it cannot disable caching.
        env:
          GOCACHE: ${{ steps.go-cache.outputs.root }}/build
          GOMODCACHE: ${{ steps.go-cache.outputs.root }}/mod
        with:
          ref: main

      - name: Preserve the trusted policy before downloading PR data
        run: cp attest.policy.yaml "$RUNNER_TEMP/attest.policy.yaml"

      - name: Download the staged reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: annotate-reports
          path: .

      # Reuse the exact selector, not a second query implementation. An empty edge
      # output is bootstrap only if this independent query also finds no baseline.
      - name: Recheck main when edge reports no baseline
        id: baseline-recheck
        if: needs.edge.outputs.baseline-run-id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: *select-baseline

      - name: Validate edge's selected main baseline run
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ needs.edge.outputs.baseline-run-id }}
          RECHECK_RUN_ID: ${{ steps.baseline-recheck.outputs.run-id }}
        run: |
          set -euo pipefail
          if [ -z "$BASELINE_RUN_ID" ]; then
            if [ -n "$RECHECK_RUN_ID" ]; then
              echo "::error::edge reported no baseline but main has one ($RECHECK_RUN_ID)."
              exit 1
            fi
            echo "::warning::Baseline bootstrap: edge and the independent trusted-run query found no main baseline."
            exit 0
          fi
          [[ "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid baseline run id"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID" \
            | jq -e --arg repo "$GITHUB_REPOSITORY" '
                (.event == "push" or .event == "workflow_dispatch" or .event == "schedule")
                and .head_branch == "main" and .head_repository.full_name == $repo
                and .conclusion == "success" and .path == ".github/workflows/ci.yml"'

      - name: Prepare isolated summary transport
        run: |
          cat > "$RUNNER_TEMP/annotate-summary.py" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments"
          marker = "<!-- attest:pr-annotate -->"
          pages = json.loads(subprocess.check_output(
              ["gh", "api", "--paginate", "--slurp", endpoint], text=True
          ))
          comments = sorted(
              (c for page in pages for c in page
               if c["user"]["login"] == "github-actions[bot]"
               and c["user"]["type"] == "Bot" and marker in c["body"]),
              key=lambda c: c["id"],
          )
          comment = comments[0] if comments else None
          identity = [comment["id"], comment["updated_at"]] if comment else None
          mode, pair = sys.argv[1:3]
          snapshot = root / f"attest-before-{pair}.json"
          if mode == "before":
              snapshot.write_text(json.dumps(identity))
          elif mode == "after":
              before = json.loads(snapshot.read_text())
              if comment and identity != before:
                  text = comment["body"].replace(marker, "").strip()
              else:
                  text = f"summary not produced (outcome={os.environ['REPORT_OUTCOME']})"
              (root / f"attest-{pair}.md").write_text(text)
          elif mode == "publish":
              pairs = ("live-py", "live-ts", "replay-py", "replay-ts")
              headers = [f"## {name}\n\n" for name in pairs]
              prefix = marker + "\n"
              budget = (65536 - len(prefix) - sum(map(len, headers)) - 6) // 4
              note = "\n\n[Summary truncated to fit GitHub's comment limit.]"
              sections = []
              for name, header in zip(pairs, headers):
                  text = (root / f"attest-{name}.md").read_text()
                  if len(text) > budget:
                      text = text[:budget - len(note)] + note
                  sections.append(header + text)
              body = prefix + "\n\n".join(sections)
              assert len(body) <= 65536
              payload = root / "attest-comment.json"
              payload.write_text(json.dumps({"body": body}))
              target = (f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{comment['id']}"
                        if comment else endpoint)
              subprocess.run(["gh", "api", "--method", "PATCH" if comment else "POST",
                              target, "--input", str(payload)], check=True)
          else:
              raise SystemExit(f"Unknown summary transport mode: {mode}")
          PY

      - name: Download main's selected baseline reports
        if: needs.edge.outputs.baseline-run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attest-reports
          path: baseline-reports
          run-id: ${{ needs.edge.outputs.baseline-run-id }}
          github-token: ${{ github.token }}

      - name: Prepare the trusted policy and baseline pins
        id: policy
        env:
          ENGINE: ${{ steps.attest.outputs.engine-path }}
          BASELINE_RUN_ID: ${{ needs.edge.outputs.baseline-run-id }}
          ATTEST_CACHE_DIR: ${{ runner.temp }}/annotate-cache
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/attest.policy.yaml"
          if [ -n "$BASELINE_RUN_ID" ]; then
            for pair in 'py main-py' 'ts main-ts' 'replay.py main-replay-py' 'replay.ts main-replay-ts'; do
              read -r suffix tag <<< "$pair"
              "$ENGINE" baseline pin --tag "$tag" --report "baseline-reports/attest-report.$suffix.json"
            done
          else
            echo "::warning::Baseline bootstrap: edge selected no main baseline; annotations use the no-baseline policy."
            policy="$RUNNER_TEMP/attest.policy.no-baseline.yaml"
            grep -v '^block_on_regression:' "$RUNNER_TEMP/attest.policy.yaml" > "$policy"
          fi
          echo "path=$policy" >> "$GITHUB_OUTPUT"

      # One baseline tag per call. Each call upserts the same bot-owned comment; save
      # each result and combine them so a later pass cannot hide an earlier regression.
      - name: Snapshot before Python live annotation
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" before live-py

      - name: Annotate Python live report
        id: live-py
        continue-on-error: true
        uses: attest-framework/attest/.github/actions/pr-annotate@52cc9b494c2ad8390aef17d40ff60484540b6603 # v1.1.0-rc.3
        env:
          ATTEST_CACHE_DIR: ${{ runner.temp }}/annotate-cache
        with:
          report: py/attest-report.py.json
          policy: ${{ steps.policy.outputs.path }}
          baseline-tag: ${{ needs.edge.outputs.baseline-run-id != '' && 'main-py' || '' }}
          engine-binary: ${{ steps.attest.outputs.engine-path }}

      - name: Preserve Python live summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_OUTCOME: ${{ steps.live-py.outcome }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" after live-py

      - name: Snapshot before TypeScript live annotation
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" before live-ts

      - name: Annotate TypeScript live report
        id: live-ts
        continue-on-error: true
        uses: attest-framework/attest/.github/actions/pr-annotate@52cc9b494c2ad8390aef17d40ff60484540b6603 # v1.1.0-rc.3
        env:
          ATTEST_CACHE_DIR: ${{ runner.temp }}/annotate-cache
        with:
          report: ts/attest-report.ts.json
          policy: ${{ steps.policy.outputs.path }}
          baseline-tag: ${{ needs.edge.outputs.baseline-run-id != '' && 'main-ts' || '' }}
          engine-binary: ${{ steps.attest.outputs.engine-path }}

      - name: Preserve TypeScript live summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_OUTCOME: ${{ steps.live-ts.outcome }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" after live-ts

      - name: Snapshot before Python replay annotation
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" before replay-py

      - name: Annotate Python replay report
        id: replay-py
        continue-on-error: true
        uses: attest-framework/attest/.github/actions/pr-annotate@52cc9b494c2ad8390aef17d40ff60484540b6603 # v1.1.0-rc.3
        env:
          ATTEST_CACHE_DIR: ${{ runner.temp }}/annotate-cache
        with:
          report: py/attest-report.replay.py.json
          policy: ${{ steps.policy.outputs.path }}
          baseline-tag: ${{ needs.edge.outputs.baseline-run-id != '' && 'main-replay-py' || '' }}
          engine-binary: ${{ steps.attest.outputs.engine-path }}

      - name: Preserve Python replay summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_OUTCOME: ${{ steps.replay-py.outcome }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" after replay-py

      - name: Snapshot before TypeScript replay annotation
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" before replay-ts

      - name: Annotate TypeScript replay report
        id: replay-ts
        continue-on-error: true
        uses: attest-framework/attest/.github/actions/pr-annotate@52cc9b494c2ad8390aef17d40ff60484540b6603 # v1.1.0-rc.3
        env:
          ATTEST_CACHE_DIR: ${{ runner.temp }}/annotate-cache
        with:
          report: ts/attest-report.replay.ts.json
          policy: ${{ steps.policy.outputs.path }}
          baseline-tag: ${{ needs.edge.outputs.baseline-run-id != '' && 'main-replay-ts' || '' }}
          engine-binary: ${{ steps.attest.outputs.engine-path }}

      - name: Preserve TypeScript replay summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_OUTCOME: ${{ steps.replay-ts.outcome }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" after replay-ts

      - name: Publish one combined summary comment
        if: ${{ !cancelled() && steps.policy.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -I "$RUNNER_TEMP/annotate-summary.py" publish all

      - name: Enforce all four annotation evaluations
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: ${{ steps.live-py.outcome }} ${{ steps.live-ts.outcome }} ${{ steps.replay-py.outcome }} ${{ steps.replay-ts.outcome }}
        run: |
          read -r -a outcomes <<< "$OUTCOMES"
          if [ "${#outcomes[@]}" -ne 4 ]; then
            echo "::error::Expected exactly four annotation evaluation outcomes."
            exit 1
          fi
          for outcome in "${outcomes[@]}"; do
            if [ "$outcome" != success ]; then
              echo "::error::An attest report blocked or could not be evaluated; see the per-report annotations and summary."
              exit 1
            fi
          done

  released:
    name: released (latest verified tag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find the latest verified tag
        id: tag
        run: |
          set -euo pipefail
          # versionsort.suffix sorts 1.0.0-rc.N below 1.0.0.
          tag="$(git -c versionsort.suffix=-rc tag --list 'verified-*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "::error::No verified-* tag exists; the nightly walkthrough has nothing to run."
            exit 1
          elif [ -z "$tag" ]; then
            echo "::notice::No verified-* tag exists yet; the released channel has nothing to check."
          elif ! git merge-base --is-ancestor "refs/tags/$tag" refs/remotes/origin/main; then
            echo "::error::$tag is not on main; verified tags mark main commits only."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the verified tag
        if: steps.tag.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Check the tag pins its published attest version
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#verified-}"
          pep440="$(echo "$version" | sed -E 's/-rc\.([0-9]+)$/rc\1/')"
          py="$(grep -A1 '^name = "attest-ai"$' py/uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          core="$(jq -r '.devDependencies["@attest-ai/core"]' ts/package.json)"
          vitest="$(jq -r '.devDependencies["@attest-ai/vitest"]' ts/package.json)"
          echo "tag $TAG: attest-ai $py, @attest-ai/core $core, @attest-ai/vitest $vitest"
          if [ "$py" != "$pep440" ] || [ "$core" != "$version" ] || [ "$vitest" != "$version" ]; then
            echo "::error::$TAG must pin attest-ai==$pep440 and @attest-ai/*@$version"
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.tag.outputs.tag != ''

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.tag.outputs.tag != ''
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tag.outputs.tag != ''
        with:
          node-version: 22

      - name: Install the agents on the published attest
        if: steps.tag.outputs.tag != ''
        run: make setup CHANNEL=released

      # The nightly run replaces make check with the walkthrough, which runs every suite itself
      # (scripts/walkthrough.py), and fails the job on the first act that ends differently. A
      # manual dispatch runs both.
      - name: make check
        if: steps.tag.outputs.tag != '' && github.event_name != 'schedule'
        env:
          PYTEST_XDIST: -n auto
        run: make check CHANNEL=released

      - name: make walkthrough
        if: steps.tag.outputs.tag != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          PYTEST_XDIST: -n auto
        run: make walkthrough CHANNEL=released

      - name: Upload reports
        if: always() && steps.tag.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: released-reports
          path: reports/
          if-no-files-found: warn

  # The single check a ruleset requires. if: always() makes it report even when a needed job
  # fails or is cancelled; a skipped job (edge on a tag push) is not a failure. It runs no repo
  # code and reads no secret.
  required:
    name: required
    needs: [edge, annotate, released]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(" ")')"
          if [ -n "$bad" ]; then
            echo "::error::required: failed or cancelled: $bad"
            exit 1
          fi
