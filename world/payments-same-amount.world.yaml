# The payments and support API the Refund Desk agents call (synthetic), as an attest world, for the
# same-amount partial-refund case (issue #52): no faults. O-2088 ($36.00, C-0858) is a pair of mugs
# that both arrived chipped, and the customer was approved $8.00 back for each: two valid partial
# refunds of the same amount on one order, each with its own idempotency key (issue #51).
# `attest-engine world` hosts it on a loopback port and puts its base URL in PAYMENTS_BASE_URL;
# every run starts from this file, so nothing resets.
#
# A world file has no include, so keep this file in step with payments-inc-1077.world.yaml: they
# differ only in the seed and the O-2088 order.
world_version: 1
base_url_env: PAYMENTS_BASE_URL
seed: 2088
resources:
  orders:
    path: /orders
    id_field: order_id
    routes: [get]
    seed:
      - order_id: O-1042
        customer_id: C-0311
        customer_email: alex.synthetic@example.com
        item: Ceramic pour-over set (synthetic)
        amount_cents: 8400
        currency: USD
        status: delivered
      - order_id: O-2001
        customer_id: C-0520
        customer_email: sam.synthetic@example.com
        item: Linen apron (synthetic)
        amount_cents: 2650
        currency: USD
        status: delivered
      - order_id: O-2077
        customer_id: C-0744
        customer_email: robin.synthetic@example.com
        item: Walnut serving board (synthetic)
        amount_cents: 12600
        currency: USD
        status: delivered
      - order_id: O-2088
        customer_id: C-0858
        customer_email: kim.synthetic@example.com
        item: Pair of stoneware mugs (synthetic)
        amount_cents: 3600
        currency: USD
        status: delivered
  refunds:
    path: /refunds
    id_field: refund_id
    id_format: "R-%04d"
    routes: [create, list, get]
    filters: [order_id]
    idempotency: {header: Idempotency-Key, field: idempotency_key}
  notifications:
    path: /notifications
    id_field: notification_id
    id_format: "N-%04d"
    routes: [create]
